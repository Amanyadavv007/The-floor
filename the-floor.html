<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Floor</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Newsreader:wght@500;600&family=JetBrains+Mono:wght@400;500;600&display=swap');

:root{
  --bg:#14171B;
  --surface:#1B1F24;
  --surface-2:#232830;
  --ink:#EDEAE2;
  --ink-dim:#8B9096;
  --line:#2C3238;
  --go:#6FA8A6;
  --go-dim:rgba(111,168,166,0.14);
  --alert:#E2A550;
  --alert-dim:rgba(226,165,80,0.12);
  --radius:3px;
  --serif:'Newsreader','Iowan Old Style','Palatino Linotype',Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono','Cascadia Code',Consolas,monospace;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
@media (prefers-reduced-motion: reduce){
  *{transition:none !important; animation:none !important;}
}

.app{
  max-width:640px;
  margin:0 auto;
  padding:24px 18px 60px;
}

/* header */
.header{margin-bottom:22px;}
.header-top{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  margin-bottom:18px;
}
.wordmark{
  font-family:var(--serif);
  font-size:1.3rem;
  font-weight:600;
  letter-spacing:0.01em;
}
.today-date{
  font-family:var(--mono);
  font-size:0.78rem;
  color:var(--ink-dim);
}
.identity{
  display:flex;
  align-items:baseline;
  gap:2px;
  border-bottom:1px solid var(--line);
  padding-bottom:18px;
}
.identity-num{
  font-family:var(--serif);
  font-size:clamp(2.6rem,11vw,3.6rem);
  font-weight:600;
  line-height:1;
}
.identity-label{
  font-family:var(--mono);
  font-size:0.78rem;
  color:var(--ink-dim);
  margin-left:6px;
}

/* tabs */
.tabs{
  display:flex;
  gap:2px;
  background:var(--surface-2);
  border-radius:var(--radius);
  padding:3px;
  margin-bottom:20px;
}
.tab-btn{
  flex:1;
  background:transparent;
  border:none;
  padding:10px 4px;
  font-family:var(--sans);
  font-size:0.86rem;
  color:var(--ink-dim);
  border-radius:2px;
  cursor:pointer;
  transition:background 0.15s ease, color 0.15s ease;
}
.tab-btn[aria-selected="true"]{
  background:var(--surface);
  color:var(--ink);
  font-weight:600;
}
.tab-btn:focus-visible{outline:2px solid var(--go); outline-offset:2px;}

.tab-panel[hidden]{display:none;}

/* mode banner */
.mode-banner{
  border:1px solid var(--alert);
  background:var(--alert-dim);
  border-radius:var(--radius);
  padding:14px 16px;
  margin-bottom:16px;
}
.mode-banner h3{
  font-family:var(--sans);
  color:var(--alert);
  font-weight:600;
  font-size:0.95rem;
  margin:0 0 6px;
}
.mode-banner p{
  margin:0;
  color:var(--ink);
  font-size:0.88rem;
  line-height:1.55;
}
.welcome-banner{
  border:1px solid var(--line);
  background:var(--surface);
  border-radius:var(--radius);
  padding:14px 16px;
  margin-bottom:16px;
}
.welcome-banner h3{font-family:var(--sans); font-size:0.95rem; margin:0 0 6px; color:var(--ink);}
.welcome-banner p{margin:0; color:var(--ink-dim); font-size:0.88rem; line-height:1.55;}

/* category cards */
.cat-card{
  border:1px solid var(--line);
  background:var(--surface);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:12px;
}
.cat-label{
  font-family:var(--sans);
  font-weight:600;
  font-size:1rem;
  margin:0 0 10px;
}
.cat-ideal{
  font-family:var(--mono);
  font-size:0.72rem;
  color:var(--ink-dim);
  margin:0 0 6px;
  line-height:1.5;
}
.cat-floor{
  font-family:var(--sans);
  font-size:0.87rem;
  color:var(--ink);
  margin:0 0 14px;
  line-height:1.5;
}
.cat-floor b{color:var(--go); font-weight:600;}

.check-row{
  display:flex;
  align-items:center;
  gap:10px;
  padding:5px 0;
}
.check-row label{
  font-family:var(--sans);
  font-size:0.9rem;
  color:var(--ink);
  cursor:pointer;
}
input[type=checkbox]{
  appearance:none;
  -webkit-appearance:none;
  width:21px;height:21px;
  border:1.5px solid var(--line);
  background:var(--surface-2);
  border-radius:3px;
  cursor:pointer;
  position:relative;
  flex-shrink:0;
  margin:0;
  transition:background 0.15s ease, border-color 0.15s ease;
}
input[type=checkbox]:checked{
  background:var(--go);
  border-color:var(--go);
}
input[type=checkbox]:checked::after{
  content:'';
  position:absolute;
  left:6px; top:2px;
  width:6px; height:11px;
  border:solid var(--bg);
  border-width:0 2px 2px 0;
  transform:rotate(40deg);
}
input[type=checkbox]:focus-visible{outline:2px solid var(--go); outline-offset:2px;}

/* progress tab */
.progress-block{margin-bottom:22px;}
.progress-head{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  margin-bottom:8px;
}
.progress-title{font-family:var(--sans); font-weight:600; font-size:0.92rem;}
.progress-count{font-family:var(--mono); font-size:0.8rem; color:var(--go);}
.grid-cells{
  display:grid;
  grid-template-columns:repeat(15,1fr);
  gap:4px;
}
.cell{
  aspect-ratio:1;
  border:1px solid var(--line);
  border-radius:2px;
  background:transparent;
  transition:background 0.15s ease;
}
.cell.done{background:var(--go); border-color:var(--go);}

/* plan tab */
.how-it-works{
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:20px;
}
.how-it-works h2{
  font-family:var(--serif);
  font-size:1.05rem;
  font-weight:600;
  margin:0 0 10px;
}
.how-it-works ul{margin:0; padding-left:18px;}
.how-it-works li{
  font-family:var(--sans);
  font-size:0.85rem;
  color:var(--ink-dim);
  line-height:1.6;
  margin-bottom:6px;
}
.plan-cat{margin-bottom:20px;}
.plan-cat h3{
  font-family:var(--sans);
  font-size:0.95rem;
  font-weight:600;
  margin:0 0 10px;
}
.field-label{
  display:block;
  font-family:var(--mono);
  font-size:0.7rem;
  color:var(--ink-dim);
  margin-bottom:4px;
  text-transform:lowercase;
}
.field{
  width:100%;
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:var(--radius);
  color:var(--ink);
  font-family:var(--sans);
  font-size:0.87rem;
  padding:9px 10px;
  margin-bottom:12px;
  resize:vertical;
  line-height:1.5;
}
.field:focus-visible, .field:focus{outline:2px solid var(--go); outline-offset:1px; border-color:var(--go);}

.btn-primary{
  width:100%;
  background:var(--go);
  color:var(--bg);
  border:none;
  border-radius:var(--radius);
  padding:13px;
  font-family:var(--sans);
  font-weight:600;
  font-size:0.92rem;
  cursor:pointer;
  margin-bottom:28px;
  transition:opacity 0.15s ease;
}
.btn-primary:focus-visible{outline:2px solid var(--ink); outline-offset:2px;}

.danger-zone{border-top:1px solid var(--line); padding-top:16px;}
.btn-ghost{
  background:transparent;
  border:1px solid var(--line);
  color:var(--ink-dim);
  border-radius:var(--radius);
  padding:10px 14px;
  font-family:var(--sans);
  font-size:0.82rem;
  cursor:pointer;
  transition:border-color 0.15s ease, color 0.15s ease;
}
.btn-ghost.confirming{border-color:var(--alert); color:var(--alert);}

.loading{
  font-family:var(--mono);
  color:var(--ink-dim);
  font-size:0.85rem;
  padding:40px 0;
  text-align:center;
}

@media(min-width:640px){
  .app{padding:40px 24px 70px;}
}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="loading">Loading your data…</div>
</div>

<script>
// ---------- date helpers ----------
function fmtDate(d){
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,'0');
  const day=String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+day;
}
function addDays(dateStr, delta){
  const parts=dateStr.split('-').map(Number);
  const dt=new Date(parts[0],parts[1]-1,parts[2]);
  dt.setDate(dt.getDate()+delta);
  return fmtDate(dt);
}
function todayKey(){ return fmtDate(new Date()); }
function displayDate(){
  return new Date().toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});
}

// ---------- default config ----------
const CAT_ORDER=['physical','study','diet','digital'];
function defaultConfig(){
  return {
    startDate: todayKey(),
    categories:{
      physical:{
        label:'Physical space & hygiene',
        ideal:'Bed made, laundry cycle kept up, shower and basic grooming done.',
        floor:'Any ONE of the three below. That alone is a win.',
        ifthen:"If I get back to my room and want to just collapse, I reset the bed for 30 seconds first \u2014 that's the whole rule.",
        type:'multi',
        items:[
          {id:'bed', label:'Bed reset (30 sec)'},
          {id:'clothes', label:'Clean clothes on'},
          {id:'hygiene', label:'Basic hygiene done'}
        ]
      },
      study:{
        label:'Study / deep work',
        ideal:'A real focused block on DSA or JS.',
        floor:'Open the book or the IDE and attempt ONE problem. Two minutes counts.',
        ifthen:"If I open reels before I've opened my notes, I close it and do one problem attempt first \u2014 doesn't matter which subject.",
        type:'single'
      },
      diet:{
        label:'Diet',
        ideal:'A full balanced day, protein around 75-80g.',
        floor:'Get ONE protein source in \u2014 egg, milk, or a shake. Any time of day.',
        ifthen:"If I'm about to skip a PG meal or grab junk instead, I get one protein source in first, before anything else.",
        type:'single'
      },
      digital:{
        label:'Digital / reels control',
        ideal:'A full block with the phone out of reach entirely.',
        floor:'One environment action before you sit down to study \u2014 phone in another room, or blocker on.',
        ifthen:"If I sit down to study, my phone goes in another room or on airplane mode before I open my notes \u2014 not after.",
        type:'single'
      }
    }
  };
}

const HOW_IT_WORKS=[
  "Floors, not ideals \u2014 every category has a version you genuinely cannot fail. That's what gets logged as a win, not the full ideal.",
  "No streaks \u2014 progress is shown as X/30, a rolling window. One bad day doesn't erase two good weeks.",
  "Recovery mode \u2014 after 3 days of zero floors, the ask drops even lower instead of piling on.",
  "Environment over willpower \u2014 the digital floor is an action you take (move the phone), not a feeling you're asked to resist.",
  "If-then plans \u2014 decide your response to the hard moment now, below, before it's midnight and you're tired.",
  "Physical space is tracked on its own \u2014 a bad study day shouldn't wreck your room too, and a messy room shouldn't wreck your study day."
];

// ---------- state ----------
const STATE={ config:null, logs:null, currentTab:'today' };

// ---------- storage ----------
async function loadState(){
  let config=null, logs=null;
  try{
    const res=await window.storage.get('config', false);
    config=res? JSON.parse(res.value): null;
  }catch(e){ config=null; }
  if(!config){
    config=defaultConfig();
    try{ await window.storage.set('config', JSON.stringify(config), false); }catch(e){ console.error('save config failed',e); }
  }
  try{
    const res=await window.storage.get('logs', false);
    logs=res? JSON.parse(res.value): null;
  }catch(e){ logs=null; }
  if(!logs){ logs={}; }
  STATE.config=config;
  STATE.logs=logs;
}
async function persistLogs(){
  try{ await window.storage.set('logs', JSON.stringify(STATE.logs), false); }
  catch(e){ console.error('save logs failed', e); }
}
async function persistConfig(){
  try{ await window.storage.set('config', JSON.stringify(STATE.config), false); }
  catch(e){ console.error('save config failed', e); }
}

// ---------- logic ----------
function emptyDayLog(){
  return { physical:{bed:false,clothes:false,hygiene:false}, study:false, diet:false, digital:false };
}
function isFloorMet(dayLog, catId, catDef){
  if(!dayLog) return false;
  if(catDef.type==='multi'){
    const v=dayLog[catId]||{};
    return Object.values(v).some(Boolean);
  }
  return !!dayLog[catId];
}
function countCompleted(dayLog, config){
  if(!dayLog) return 0;
  let n=0;
  for(const catId of CAT_ORDER){
    if(isFloorMet(dayLog, catId, config.categories[catId])) n++;
  }
  return n;
}
function computeMode(){
  const today=todayKey();
  const daysSinceStart=Math.round((new Date(today)-new Date(STATE.config.startDate))/86400000);
  if(daysSinceStart<3) return 'normal';
  let missed=0;
  for(let i=1;i<=3;i++){
    const d=addDays(today,-i);
    const dl=STATE.logs[d];
    if(countCompleted(dl, STATE.config)===0) missed++;
  }
  return missed===3? 'recovery':'normal';
}
function overallShowUpCount(){
  const today=todayKey();
  let n=0;
  for(let i=0;i<30;i++){
    const d=addDays(today,-i);
    const dl=STATE.logs[d];
    if(countCompleted(dl, STATE.config)>0) n++;
  }
  return n;
}

// ---------- render ----------
function render(){
  renderHeader();
  renderTabs();
  if(STATE.currentTab==='today') renderToday();
  else if(STATE.currentTab==='progress') renderProgress();
  else renderPlan();
}

function renderHeader(){
  document.getElementById('todayDate').textContent=displayDate();
  document.getElementById('identityNum').textContent=overallShowUpCount();
}

function renderTabs(){
  document.querySelectorAll('.tab-btn').forEach(function(btn){
    const on=btn.dataset.tab===STATE.currentTab;
    btn.setAttribute('aria-selected', on? 'true':'false');
  });
  document.getElementById('tabToday').hidden = STATE.currentTab!=='today';
  document.getElementById('tabProgress').hidden = STATE.currentTab!=='progress';
  document.getElementById('tabPlan').hidden = STATE.currentTab!=='plan';
}

function renderToday(){
  const today=todayKey();
  if(!STATE.logs[today]) STATE.logs[today]=emptyDayLog();
  const dayLog=STATE.logs[today];

  const mode=computeMode();
  const bannerEl=document.getElementById('modeBanner');
  if(mode==='recovery'){
    bannerEl.innerHTML = '<div class="mode-banner"><h3>You\u2019ve gone quiet for 3 days.</h3>'
      + '<p>That\u2019s the exact pattern \u2014 a couple good weeks, then months of nothing. Don\u2019t try to fix all four today. Pick ONE category below and just hit the floor. That\u2019s the whole job right now.</p></div>';
  } else {
    const daysSinceStart=Math.round((new Date(today)-new Date(STATE.config.startDate))/86400000);
    if(daysSinceStart<1){
      bannerEl.innerHTML = '<div class="welcome-banner"><h3>Day one.</h3>'
        + '<p>Just hit the floors below. Nothing else matters today.</p></div>';
    } else {
      bannerEl.innerHTML='';
    }
  }

  const cardsEl=document.getElementById('todayCards');
  cardsEl.innerHTML = CAT_ORDER.map(function(catId){
    const cat=STATE.config.categories[catId];
    let body='';
    if(cat.type==='multi'){
      body = cat.items.map(function(item){
        const checked = dayLog[catId] && dayLog[catId][item.id] ? 'checked' : '';
        return '<div class="check-row"><input type="checkbox" id="chk-'+catId+'-'+item.id+'" data-cat="'+catId+'" data-item="'+item.id+'" '+checked+'>'
          + '<label for="chk-'+catId+'-'+item.id+'">'+item.label+'</label></div>';
      }).join('');
    } else {
      const checked = dayLog[catId] ? 'checked' : '';
      body = '<div class="check-row"><input type="checkbox" id="chk-'+catId+'" data-cat="'+catId+'" '+checked+'>'
        + '<label for="chk-'+catId+'">Floor met today</label></div>';
    }
    return '<div class="cat-card">'
      + '<p class="cat-label">'+cat.label+'</p>'
      + '<p class="cat-ideal">ideal: '+cat.ideal+'</p>'
      + '<p class="cat-floor"><b>Floor:</b> '+cat.floor+'</p>'
      + body
      + '</div>';
  }).join('');

  cardsEl.querySelectorAll('input[type=checkbox]').forEach(function(inp){
    inp.addEventListener('change', onCheckToggle);
  });
}

function onCheckToggle(e){
  const catId=e.target.dataset.cat;
  const itemId=e.target.dataset.item;
  const today=todayKey();
  if(!STATE.logs[today]) STATE.logs[today]=emptyDayLog();
  if(itemId){
    if(!STATE.logs[today][catId]) STATE.logs[today][catId]={};
    STATE.logs[today][catId][itemId]=e.target.checked;
  } else {
    STATE.logs[today][catId]=e.target.checked;
  }
  persistLogs();
  renderHeader();
}

function renderProgress(){
  const today=todayKey();
  const el=document.getElementById('progressGrids');
  el.innerHTML = CAT_ORDER.map(function(catId){
    const cat=STATE.config.categories[catId];
    let doneCount=0;
    let cells='';
    for(let i=29;i>=0;i--){
      const d=addDays(today,-i);
      const dl=STATE.logs[d];
      const met=isFloorMet(dl, catId, cat);
      if(met) doneCount++;
      cells += '<span class="cell'+(met?' done':'')+'" title="'+d+'"></span>';
    }
    return '<div class="progress-block">'
      + '<div class="progress-head"><span class="progress-title">'+cat.label+'</span><span class="progress-count">'+doneCount+'/30</span></div>'
      + '<div class="grid-cells">'+cells+'</div>'
      + '</div>';
  }).join('');
}

function renderPlan(){
  document.getElementById('howList').innerHTML = HOW_IT_WORKS.map(function(t){ return '<li>'+t+'</li>'; }).join('');

  const el=document.getElementById('planForm');
  el.innerHTML = CAT_ORDER.map(function(catId){
    const cat=STATE.config.categories[catId];
    return '<div class="plan-cat">'
      + '<h3>'+cat.label+'</h3>'
      + '<label class="field-label" for="ideal-'+catId+'">ideal</label>'
      + '<input class="field" id="ideal-'+catId+'" data-cat="'+catId+'" data-field="ideal" value="'+escapeAttr(cat.ideal)+'">'
      + '<label class="field-label" for="floor-'+catId+'">floor</label>'
      + '<textarea class="field" id="floor-'+catId+'" data-cat="'+catId+'" data-field="floor" rows="2">'+escapeHtml(cat.floor)+'</textarea>'
      + '<label class="field-label" for="ifthen-'+catId+'">if-then plan</label>'
      + '<textarea class="field" id="ifthen-'+catId+'" data-cat="'+catId+'" data-field="ifthen" rows="2">'+escapeHtml(cat.ifthen)+'</textarea>'
      + '</div>';
  }).join('');
}

function escapeAttr(s){
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;');
}
function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function onSavePlan(){
  document.querySelectorAll('#planForm [data-field]').forEach(function(f){
    const catId=f.dataset.cat, field=f.dataset.field;
    STATE.config.categories[catId][field]=f.value;
  });
  await persistConfig();
  const btn=document.getElementById('savePlanBtn');
  const original=btn.textContent;
  btn.textContent='Saved';
  setTimeout(function(){ btn.textContent=original; }, 1500);
}

let resetConfirming=false;
let resetTimer=null;
function onResetClick(){
  const btn=document.getElementById('resetBtn');
  if(!resetConfirming){
    resetConfirming=true;
    btn.textContent='Tap again to confirm \u2014 deletes everything';
    btn.classList.add('confirming');
    resetTimer=setTimeout(function(){
      resetConfirming=false;
      btn.textContent='Reset all data';
      btn.classList.remove('confirming');
    }, 3000);
    return;
  }
  clearTimeout(resetTimer);
  resetConfirming=false;
  doReset();
}
async function doReset(){
  STATE.config=defaultConfig();
  STATE.logs={};
  await persistConfig();
  await persistLogs();
  STATE.currentTab='today';
  render();
}

// ---------- init ----------
function buildShell(){
  document.getElementById('app').innerHTML = ''
    + '<header class="header">'
    +   '<div class="header-top"><span class="wordmark">The Floor</span><span class="today-date" id="todayDate"></span></div>'
    +   '<div class="identity"><span class="identity-num" id="identityNum">\u2013</span><span class="identity-label">/30 days you showed up</span></div>'
    + '</header>'
    + '<nav class="tabs" role="tablist">'
    +   '<button class="tab-btn" data-tab="today" role="tab">Today</button>'
    +   '<button class="tab-btn" data-tab="progress" role="tab">Progress</button>'
    +   '<button class="tab-btn" data-tab="plan" role="tab">Plan</button>'
    + '</nav>'
    + '<main id="tabToday" class="tab-panel"><div id="modeBanner"></div><div id="todayCards"></div></main>'
    + '<main id="tabProgress" class="tab-panel" hidden><div id="progressGrids"></div></main>'
    + '<main id="tabPlan" class="tab-panel" hidden>'
    +   '<div class="how-it-works"><h2>How this works</h2><ul id="howList"></ul></div>'
    +   '<div id="planForm"></div>'
    +   '<button id="savePlanBtn" class="btn-primary">Save plan</button>'
    +   '<div class="danger-zone"><button id="resetBtn" class="btn-ghost">Reset all data</button></div>'
    + '</main>';

  document.querySelectorAll('.tab-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      STATE.currentTab=btn.dataset.tab;
      render();
    });
  });
  document.getElementById('savePlanBtn').addEventListener('click', onSavePlan);
  document.getElementById('resetBtn').addEventListener('click', onResetClick);
}

(async function(){
  await loadState();
  buildShell();
  render();
})();
</script>
</body>
</html>
